# Pipeline Logstash minimal de MicroCRM
#   entrée  : logs des conteneurs envoyés par le pilote GELF de Docker (UDP 12201)
#   filtre  : lecture du JSON, champs communs back/front
#   sortie  : un index Elasticsearch par jour (microcrm-logs-AAAA.MM.JJ)

input {
  gelf {
    port => 12201
  }
}

filter {
  # Service d'origine : option "tag" du pilote GELF (back ou front)
  mutate { rename => { "tag" => "service" } }

  # Les deux services écrivent une ligne JSON par événement
  json {
    source => "message"
    skip_on_invalid_json => true
  }

  if [service] == "front" {
    # Logs Caddy : champs ramenés au format commun du back
    if [request] {
      mutate {
        rename => {
          "[request][method]" => "http_method"
          "[request][uri]"    => "url_path"
          "status"            => "http_status"
        }
      }
      ruby { code => "d = event.get('duration'); event.set('duration_ms', (d.to_f * 1000).round(2)) unless d.nil?" }
    }
    mutate {
      rename       => { "msg" => "message" }
      remove_field => [ "request", "resp_headers", "duration", "ts", "user_id" ]
    }
  }

  # Niveau d'un accès HTTP déduit du statut (comme pour le back)
  if [http_status] {
    mutate { convert => { "http_status" => "integer" } }
    if [http_status] >= 500 {
      mutate { replace => { "level" => "ERROR" } }
    } else if [http_status] >= 400 {
      mutate { replace => { "level" => "WARN" } }
    }
  }
  # Ligne non JSON : le pilote GELF fournit un niveau syslog numérique (3 = stderr, 6 = stdout)
  mutate { convert => { "level" => "string" } }
  if [level] in ["0", "1", "2", "3"] {
    mutate { replace => { "level" => "ERROR" } }
  } else if [level] == "4" {
    mutate { replace => { "level" => "WARN" } }
  } else if [level] in ["5", "6", "7"] {
    mutate { replace => { "level" => "INFO" } }
  }
  mutate { uppercase => [ "level" ] }

  # Champs techniques du pilote GELF inutiles pour l'analyse
  mutate {
    remove_field => [ "command", "image_id", "container_id", "created", "version", "@version",
                      "level_value", "source_host", "app", "logger" ]
  }
}

output {
  elasticsearch {
    hosts           => ["http://elasticsearch:9200"]
    index           => "microcrm-logs-%{+YYYY.MM.dd}"
    template        => "/usr/share/logstash/templates/microcrm-logs.json"
    template_name   => "microcrm-logs"
    template_overwrite => true
  }
}
