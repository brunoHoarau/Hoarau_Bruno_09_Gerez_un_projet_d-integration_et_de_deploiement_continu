# Configuration SonarQube Cloud du front-end Angular.
# L'organisation et la clé du projet sont fournies par le pipeline CI (variables GitHub),
# le jeton par la variable d'environnement SONAR_TOKEN : aucun secret dans ce fichier.

sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src
sonar.inclusions=src/**
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts

sonar.javascript.lcov.reportPaths=coverage/microcrm/lcov.info

# Le pipeline échoue si la Quality Gate n'est pas validée
sonar.qualitygate.wait=true
